<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DriverFinanzas">
    <meta name="theme-color" content="#090b11">
    <link rel="manifest" href="manifest.json">
    <title>DriverFinanzas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-user-select: none; user-select: none; }
        body { margin: 0; padding: 0; background: #090b11; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
        html, body { height: 100%; width: 100%; overflow-x: hidden; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script>
        // APP COMPLETA EN VANILLA JS
        const INITIAL_INCOMES = [
            { id: '1', date: '2026-05-02', app: 'Cabify', amount: 450000, hours: 30, notes: 'Semana de alta eficiencia' },
            { id: '2', date: '2026-05-09', app: 'Uber', amount: 400000, hours: 28, notes: 'Buen ritmo' },
            { id: '3', date: '2026-05-15', app: 'DiDi', amount: 93800, hours: 8, notes: 'Viajes dinámicos' },
            { id: '4', date: '2026-05-16', app: 'Particular', amount: 30000, hours: 2, notes: 'Viaje largo acordado' },
        ];

        const INITIAL_EXPENSES = [
            { id: 'p1', date: '2026-05-01', category: 'Alquiler y cargos', amount: 165964, type: 'Personal' },
            { id: 'p2', date: '2026-05-05', category: 'Supermercado', amount: 138746, type: 'Personal' },
            { id: 'p3', date: '2026-05-02', category: 'Estudios', amount: 97300, type: 'Personal' },
            { id: 'p4', date: '2026-05-01', category: 'Gym', amount: 47000, type: 'Personal' },
            { id: 'p5', date: '2026-05-10', category: 'Casa', amount: 42431, type: 'Personal' },
            { id: 'p6', date: '2026-05-08', category: 'Limpieza', amount: 40000, type: 'Personal' },
            { id: 'p7', date: '2026-05-12', category: 'Restaurantes y bares', amount: 34000, type: 'Personal' },
            { id: 'p8', date: '2026-05-13', category: 'Comilona', amount: 15300, type: 'Personal' },
            { id: 'p9', date: '2026-05-04', category: 'Transporte (Personal)', amount: 8500, type: 'Personal' },
            { id: 'p10', date: '2026-05-14', category: 'Entretenimiento', amount: 4689, type: 'Personal' },
            { id: 'p11', date: '2026-05-15', category: 'Otros Gastos de Vida', amount: 356070, type: 'Personal' },
            { id: 'a1', date: '2026-05-15', category: 'Combustible GNC', amount: 55550, type: 'Auto' },
            { id: 'a2', date: '2026-05-10', category: 'Patente', amount: 40150, type: 'Auto' },
            { id: 'f1', date: '2026-05-05', category: 'Cuota Deuda Familiar', amount: 500000, type: 'Deuda' },
            { id: 'r1', date: '2026-05-01', category: 'Reserva Recompra Auto (USD 226)', amount: 271200, type: 'Recompra' }
        ];

        let incomes = JSON.parse(localStorage.getItem('app_incomes')) || INITIAL_INCOMES;
        let expenses = JSON.parse(localStorage.getItem('app_expenses')) || INITIAL_EXPENSES;
        let activeTab = 'dashboard';
        let monthlyGoal = parseInt(localStorage.getItem('cfg_monthly_goal')) || 1915000;
        let daysRemaining = parseInt(localStorage.getItem('cfg_days_remaining')) || 10;

        function saveData() {
            localStorage.setItem('app_incomes', JSON.stringify(incomes));
            localStorage.setItem('app_expenses', JSON.stringify(expenses));
            localStorage.setItem('cfg_monthly_goal', monthlyGoal);
            localStorage.setItem('cfg_days_remaining', daysRemaining);
        }

        function calculateTotals() {
            const totalIncome = incomes.reduce((sum, item) => sum + item.amount, 0);
            const totalPersonal = expenses.filter(e => e.type === 'Personal').reduce((sum, item) => sum + item.amount, 0);
            const totalAuto = expenses.filter(e => e.type === 'Auto').reduce((sum, item) => sum + item.amount, 0);
            const totalDeuda = expenses.filter(e => e.type === 'Deuda').reduce((sum, item) => sum + item.amount, 0);
            const totalRecompra = expenses.filter(e => e.type === 'Recompra').reduce((sum, item) => sum + item.amount, 0);
            const totalExpenses = totalPersonal + totalAuto + totalDeuda + totalRecompra;
            const netBalance = totalIncome - totalExpenses;
            const pendingToGoal = monthlyGoal - totalIncome;
            const dailyTarget = pendingToGoal > 0 && daysRemaining > 0 ? pendingToGoal / daysRemaining : 0;
            const totalHours = incomes.reduce((sum, item) => sum + (item.hours || 0), 0);
            const avgHourlyRate = totalHours > 0 ? totalIncome / totalHours : 0;

            return { totalIncome, totalPersonal, totalAuto, totalDeuda, totalRecompra, totalExpenses, netBalance, pendingToGoal, dailyTarget, totalHours, avgHourlyRate };
        }

        function formatMoney(num) {
            return num.toLocaleString('es-AR');
        }

        function addIncome(app, amount, hours, notes, date) {
            incomes.unshift({ id: Date.now().toString(), date, app, amount: parseInt(amount), hours: parseInt(hours) || 0, notes });
            saveData();
            render();
        }

        function addExpense(category, amount, type, date) {
            expenses.unshift({ id: Date.now().toString(), date, category, amount: parseInt(amount), type });
            saveData();
            render();
        }

        function deleteIncome(id) {
            incomes = incomes.filter(i => i.id !== id);
            saveData();
            render();
        }

        function deleteExpense(id) {
            expenses = expenses.filter(e => e.id !== id);
            saveData();
            render();
        }

        function render() {
            const { totalIncome, totalPersonal, totalAuto, totalDeuda, totalRecompra, totalExpenses, netBalance, pendingToGoal, dailyTarget } = calculateTotals();
            const progressPercent = Math.min(100, (totalIncome / monthlyGoal) * 100);

            let html = `
            <div class="min-h-screen bg-[#090b11] text-slate-100 pb-24">
                <header class="sticky top-0 z-40 bg-[#090b11]/80 backdrop-blur border-b border-slate-900/60 px-4 py-3">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <div class="p-1.5 bg-emerald-500/10 text-emerald-400 rounded-lg border border-emerald-500/20">
                                🚗
                            </div>
                            <div>
                                <h1 class="text-sm font-bold text-emerald-400">DriverFinanzas</h1>
                                <p class="text-[10px] text-slate-500">Móvil Edition</p>
                            </div>
                        </div>
                    </div>
                </header>

                <main class="px-4 py-4 space-y-5 max-w-md mx-auto">
            `;

            if (activeTab === 'dashboard') {
                html += `
                    <div class="bg-gradient-to-b from-slate-900 to-slate-950 border border-slate-900 rounded-3xl p-5">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <span class="text-[10px] font-bold uppercase text-slate-500">Mayo Facturado</span>
                                <span class="text-3xl font-black text-white">$${formatMoney(totalIncome)}</span>
                            </div>
                            <div class="text-right">
                                <span class="text-[10px] font-bold uppercase text-slate-500">Meta</span>
                                <span class="text-sm font-bold text-slate-300">$${formatMoney(monthlyGoal)}</span>
                            </div>
                        </div>
                        
                        <div class="w-full h-2 bg-slate-950 rounded-full overflow-hidden mb-2">
                            <div class="h-full bg-gradient-to-r from-emerald-500 to-emerald-400" style="width: ${progressPercent}%"></div>
                        </div>
                        
                        <div class="flex justify-between text-[10px] text-slate-400 mb-4">
                            <span>Progreso: ${progressPercent.toFixed(1)}%</span>
                            <span>Faltan: $${formatMoney(Math.max(0, pendingToGoal))}</span>
                        </div>

                        ${pendingToGoal > 0 ? `
                        <div class="bg-[#0b1c15] border border-emerald-950 rounded-2xl p-4">
                            <span class="text-[10px] text-emerald-400 block uppercase font-bold">Meta Diaria</span>
                            <span class="text-2xl font-black text-emerald-400">$${formatMoney(Math.ceil(dailyTarget))}</span>
                            <span class="text-[9px] text-slate-400">En ${daysRemaining} días hábiles</span>
                        </div>
                        ` : `
                        <div class="bg-amber-950/40 border border-amber-900/30 rounded-2xl p-4 text-center">
                            <span class="text-xs text-amber-400 font-bold">¡Meta alcanzada! 🏆</span>
                        </div>
                        `}
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-slate-900/60 border border-slate-900 rounded-2xl p-4">
                            <span class="text-[10px] font-bold uppercase text-slate-500">Saldo de Caja</span>
                            <span class="text-lg font-black ${netBalance >= 0 ? 'text-emerald-400' : 'text-rose-400'}">$${formatMoney(netBalance)}</span>
                        </div>
                        <div class="bg-slate-900/60 border border-slate-900 rounded-2xl p-4">
                            <span class="text-[10px] font-bold uppercase text-slate-500">Gastos Totales</span>
                            <span class="text-lg font-black text-rose-400">$${formatMoney(totalExpenses)}</span>
                        </div>
                    </div>

                    <div class="bg-slate-900/40 border border-slate-900/80 rounded-3xl p-5">
                        <h3 class="text-xs font-bold uppercase text-slate-400 mb-4">Distribución de Gastos</h3>
                        <div class="space-y-3">
                            <div>
                                <div class="flex justify-between text-[11px] mb-1">
                                    <span class="text-slate-300">Gastos de Vida</span>
                                    <span class="text-slate-400">$${formatMoney(totalPersonal)}</span>
                                </div>
                                <div class="w-full h-1.5 bg-slate-950 rounded-full overflow-hidden">
                                    <div class="h-full bg-emerald-400" style="width: ${totalExpenses > 0 ? (totalPersonal/totalExpenses)*100 : 0}%"></div>
                                </div>
                            </div>
                            <div>
                                <div class="flex justify-between text-[11px] mb-1">
                                    <span class="text-slate-300">Gastos Auto</span>
                                    <span class="text-slate-400">$${formatMoney(totalAuto)}</span>
                                </div>
                                <div class="w-full h-1.5 bg-slate-950 rounded-full overflow-hidden">
                                    <div class="h-full bg-blue-400" style="width: ${totalExpenses > 0 ? (totalAuto/totalExpenses)*100 : 0}%"></div>
                                </div>
                            </div>
                            <div>
                                <div class="flex justify-between text-[11px] mb-1">
                                    <span class="text-slate-300">Deuda Familiar</span>
                                    <span class="text-slate-400">$${formatMoney(totalDeuda)}</span>
                                </div>
                                <div class="w-full h-1.5 bg-slate-950 rounded-full overflow-hidden">
                                    <div class="h-full bg-rose-400" style="width: ${totalExpenses > 0 ? (totalDeuda/totalExpenses)*100 : 0}%"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="activeTab='incomes'; render()" class="py-3 px-4 bg-emerald-500 text-[#090b11] rounded-2xl font-bold text-xs">
                            ➕ Ingreso
                        </button>
                        <button onclick="activeTab='expenses'; render()" class="py-3 px-4 bg-slate-900 border border-slate-800 text-rose-400 rounded-2xl font-bold text-xs">
                            ➕ Gasto
                        </button>
                    </div>
                `;
            } else if (activeTab === 'incomes') {
                html += `
                    <div>
                        <h2 class="text-base font-bold text-slate-100 mb-4">Registros de Ingreso</h2>
                        <div class="space-y-2.5">
                            ${incomes.length === 0 ? '<div class="p-4 text-center text-slate-500">Sin registros</div>' : ''}
                            ${incomes.map(item => `
                                <div class="bg-slate-900/50 border border-slate-900 rounded-2xl p-3 flex justify-between items-center">
                                    <div>
                                        <span class="font-bold text-xs text-slate-200">${item.app}</span>
                                        <span class="text-[9px] text-slate-500 ml-2">• ${item.date}</span>
                                        <p class="text-[10px] text-slate-400">${item.notes || 'Sin notas'}</p>
                                    </div>
                                    <div class="text-right">
                                        <span class="text-xs font-black text-emerald-400">$${formatMoney(item.amount)}</span>
                                        <button onclick="deleteIncome('${item.id}')" class="text-slate-600 hover:text-rose-400 text-xs mt-1">✕</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        <button onclick="activeTab='dashboard'; render()" class="mt-4 w-full py-3 bg-slate-900 rounded-2xl font-bold text-xs">Volver</button>
                    </div>
                `;
            } else if (activeTab === 'expenses') {
                html += `
                    <div>
                        <h2 class="text-base font-bold text-slate-100 mb-4">Registros de Gastos</h2>
                        <div class="space-y-2.5">
                            ${expenses.length === 0 ? '<div class="p-4 text-center text-slate-500">Sin registros</div>' : ''}
                            ${expenses.map(item => `
                                <div class="bg-slate-900/50 border border-slate-900 rounded-2xl p-3 flex justify-between items-center">
                                    <div>
                                        <span class="font-bold text-xs text-slate-200">${item.category}</span>
                                        <span class="text-[9px] text-slate-500 ml-2">• ${item.type}</span>
                                    </div>
                                    <div class="text-right">
                                        <span class="text-xs font-black text-rose-400">$${formatMoney(item.amount)}</span>
                                        <button onclick="deleteExpense('${item.id}')" class="text-slate-600 hover:text-rose-400 text-xs mt-1">✕</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        <button onclick="activeTab='dashboard'; render()" class="mt-4 w-full py-3 bg-slate-900 rounded-2xl font-bold text-xs">Volver</button>
                    </div>
                `;
            }

            html += `
                </main>
                
                <nav class="fixed bottom-0 left-0 right-0 bg-[#090b11]/90 border-t border-slate-950 px-4 py-2.5 flex justify-around max-w-md mx-auto">
                    <button onclick="activeTab='dashboard'; render()" class="flex flex-col items-center gap-1 text-${activeTab==='dashboard' ? 'emerald' : 'slate'}-${activeTab==='dashboard' ? '400' : '500'} text-xs font-bold">
                        📊 Dashboard
                    </button>
                    <button onclick="activeTab='incomes'; render()" class="flex flex-col items-center gap-1 text-${activeTab==='incomes' ? 'emerald' : 'slate'}-${activeTab==='incomes' ? '400' : '500'} text-xs font-bold">
                        💵 Ingresos
                    </button>
                    <button onclick="activeTab='expenses'; render()" class="flex flex-col items-center gap-1 text-${activeTab==='expenses' ? 'emerald' : 'slate'}-${activeTab==='expenses' ? '400' : '500'} text-xs font-bold">
                        💸 Gastos
                    </button>
                </nav>
            </div>
            `;

            document.getElementById('root').innerHTML = html;
        }

        render();
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
