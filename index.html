<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DriverFinanzas</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DriverFin">
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23090b11'/><path d='M30 43h40v26H30zM36 69h28' stroke='%2334d399' stroke-width='6' fill='none' stroke-linejoin='round'/><circle cx='43' cy='53' r='4' fill='%2334d399'/><circle cx='57' cy='53' r='4' fill='%2334d399'/></svg>">
    <link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjogIkRyaXZlckZpbmFuemFzIiwgInNob3J0X25hbWUiOiAiRHJpdmVyRmluIiwgInN0YXJ0X3VybCI6ICIuIiwgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsICJiYWNrZ3JvdW5kX2NvbG9yIjogIiMwOTBiMTEiLCAidGhlbWVfY29sb3IiOiAiIzA5MGIxMSIsICJvcmllbnRhdGlvbiI6ICJwb3J0cmFpdCJ9">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = {theme: {extend: {colors: {slate: {850: '#151b26', 950: '#090b11'}}}}}</script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { overflow-x: hidden; background-color: #090b11; -webkit-tap-highlight-color: transparent; }
        .safe-bottom { padding-bottom: calc(0.625rem + env(safe-area-inset-bottom)); }
        .safe-top { padding-top: env(safe-area-inset-top); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="h-full text-slate-100">
    <div id="root" class="h-full"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const IconCar = () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.75a1.125 1.125 0 01-1.125-1.125V15h1.5m10.125 3.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.5m-11.25-3.75h16.5a1.5 1.5 0 001.5-1.5V9.75A1.5 1.5 0 0020.25 8.25h-4.736a1.5 1.5 0 01-1.06-.44L12.28 5.64a1.5 1.5 0 00-1.06-.44H4.5A1.5 1.5 0 003 6.75v8.25c0 .414.336.75.75.75z" /></svg>;
        const IconDollar = () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M12 6v12m-3-2.818l.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.854-1.106-2.24 0-3.093 1.122-.865 2.934-.865 4.056 0l.879.659M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        const IconTrendingUp = () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M2.25 18L9 11.25l4.306 4.307a11.95 11.95 0 015.814-5.519l2.74-1.22m0 0l-5.94-2.281m5.94 2.28-2.28 5.941" /></svg>;
        const IconTrendingDown = () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M2.25 6L9 12.75l4.306-4.307a11.95 11.95 0 015.814 5.519l2.74 1.22m0 0l-5.94 2.281m5.94-2.28-2.28-5.941" /></svg>;
        const IconBriefcase = () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M20.25 14.15v4.25c0 .966-.784 1.75-1.75 1.75H5.5a1.75 1.75 0 01-1.75-1.75v-4.25m16.5 0a1.75 1.75 0 00-1.75-1.75H5.5a1.75 1.75 0 00-1.75 1.75m16.5 0V9a1.75 1.75 0 00-1.75-1.75h-2.5a.75.75 0 01-.75-.75V5a1.75 1.75 0 00-1.75-1.75h-3.5A1.75 1.75 0 008.5 5v1.5a.75.75 0 01-.75.75H5.25A1.75 1.75 0 003.5 9v5.15M12 12h.008v.008H12V12z" /></svg>;
        const IconPlus = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>;
        const IconSliders = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-9.75 0h9.75" /></svg>;
        const IconX = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>;
        const IconTrash = () => <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" /></svg>;

        const INITIAL_INCOMES = [
          { id: '1', date: '2026-05-02', app: 'Cabify', amount: 450000, hours: 30, notes: 'Semana de alta eficiencia' },
          { id: '2', date: '2026-05-09', app: 'Uber', amount: 400000, hours: 28, notes: 'Buen ritmo' },
          { id: '3', date: '2026-05-15', app: 'DiDi', amount: 93800, hours: 8, notes: 'Viajes dinámicos' },
          { id: '4', date: '2026-05-16', app: 'Particular', amount: 30000, hours: 2, notes: 'Viaje largo acordado' },
        ];

        const INITIAL_EXPENSES = [
          { id: 'p1', date: '2026-05-01', category: 'Alquiler y cargos', amount: 165964, type: 'Personal' },
          { id: 'p2', date: '2026-05-05', category: 'Supermercado', amount: 138746, type: 'Personal' },
          { id: 'p3', date: '2026-05-02', category: 'Estudios', amount: 97300, type: 'Personal' },
          { id: 'p4', date: '2026-05-01', category: 'Gym', amount: 47000, type: 'Personal' },
          { id: 'p5', date: '2026-05-10', category: 'Casa', amount: 42431, type: 'Personal' },
          { id: 'p6', date: '2026-05-08', category: 'Limpieza', amount: 40000, type: 'Personal' },
          { id: 'p7', date: '2026-05-12', category: 'Restaurantes y bares', amount: 34000, type: 'Personal' },
          { id: 'p8', date: '2026-05-13', category: 'Comilona', amount: 15300, type: 'Personal' },
          { id: 'p9', date: '2026-05-04', category: 'Transporte', amount: 8500, type: 'Personal' },
          { id: 'p10', date: '2026-05-14', category: 'Entretenimiento', amount: 4689, type: 'Personal' },
          { id: 'p11', date: '2026-05-15', category: 'Otros', amount: 356070, type: 'Personal' },
          { id: 'a1', date: '2026-05-15', category: 'Combustible GNC', amount: 55550, type: 'Auto' },
          { id: 'a2', date: '2026-05-10', category: 'Patente', amount: 40150, type: 'Auto' },
          { id: 'f1', date: '2026-05-05', category: 'Deuda Familiar', amount: 500000, type: 'Deuda' },
          { id: 'r1', date: '2026-05-01', category: 'Recompra Auto', amount: 271200, type: 'Recompra' }
        ];

        function App() {
          const [incomes, setIncomes] = useState(() => JSON.parse(localStorage.getItem('app_incomes')) || INITIAL_INCOMES);
          const [expenses, setExpenses] = useState(() => JSON.parse(localStorage.getItem('app_expenses')) || INITIAL_EXPENSES);
          const [activeTab, setActiveTab] = useState('dashboard');
          const [isConfigOpen, setIsConfigOpen] = useState(false);
          const [showQuickAdd, setShowQuickAdd] = useState(null);
          const [monthlyGoal, setMonthlyGoal] = useState(() => Number(localStorage.getItem('cfg_monthly_goal')) || 1915000);
          const [daysRemaining, setDaysRemaining] = useState(() => Number(localStorage.getItem('cfg_days_remaining')) || 10);
          const [dollarRate, setDollarRate] = useState(() => Number(localStorage.getItem('cfg_dollar_rate')) || 1200);
          const [toast, setToast] = useState(null);
          const [incomeForm, setIncomeForm] = useState({ date: new Date().toISOString().split('T')[0], app: 'Uber', amount: '', hours: '', notes: '' });
          const [expenseForm, setExpenseForm] = useState({ date: new Date().toISOString().split('T')[0], category: '', amount: '', type: 'Personal' });

          useEffect(() => { localStorage.setItem('app_incomes', JSON.stringify(incomes)); }, [incomes]);
          useEffect(() => { localStorage.setItem('app_expenses', JSON.stringify(expenses)); }, [expenses]);
          useEffect(() => { localStorage.setItem('cfg_monthly_goal', monthlyGoal); localStorage.setItem('cfg_days_remaining', daysRemaining); localStorage.setItem('cfg_dollar_rate', dollarRate); }, [monthlyGoal, daysRemaining, dollarRate]);

          const showToast = (message, type = 'success') => { setToast({ message, type }); setTimeout(() => setToast(null), 2500); };

          const totalIncome = incomes.reduce((sum, item) => sum + Number(item.amount), 0);
          const totalPersonal = expenses.filter(e => e.type === 'Personal').reduce((sum, item) => sum + Number(item.amount), 0);
          const totalAuto = expenses.filter(e => e.type === 'Auto').reduce((sum, item) => sum + Number(item.amount), 0);
          const totalDeuda = expenses.filter(e => e.type === 'Deuda').reduce((sum, item) => sum + Number(item.amount), 0);
          const totalRecompra = expenses.filter(e => e.type === 'Recompra').reduce((sum, item) => sum + Number(item.amount), 0);
          const totalAllExpenses = totalPersonal + totalAuto + totalDeuda + totalRecompra;
          const netBalance = totalIncome - totalAllExpenses;
          const pendingToGoal = monthlyGoal - totalIncome;
          const dailyTarget = pendingToGoal > 0 && daysRemaining > 0 ? pendingToGoal / daysRemaining : 0;
          const totalHours = incomes.reduce((sum, item) => sum + Number(item.hours || 0), 0);
          const avgHourlyRate = totalHours > 0 ? totalIncome / totalHours : 0;

          const handleAddIncome = (e) => {
            e.preventDefault();
            if (!incomeForm.amount || Number(incomeForm.amount) <= 0) { showToast('Ingresá un monto válido.', 'error'); return; }
            const newIncome = { id: Date.now().toString(), date: incomeForm.date, app: incomeForm.app, amount: Number(incomeForm.amount), hours: Number(incomeForm.hours || 0), notes: incomeForm.notes };
            setIncomes([newIncome, ...incomes]);
            setIncomeForm({ date: new Date().toISOString().split('T')[0], app: 'Uber', amount: '', hours: '', notes: '' });
            setShowQuickAdd(null);
            showToast('Ingreso guardado');
          };

          const handleAddExpense = (e) => {
            e.preventDefault();
            if (!expenseForm.category || !expenseForm.amount || Number(expenseForm.amount) <= 0) { showToast('Completa los campos.', 'error'); return; }
            const newExpense = { id: Date.now().toString(), date: expenseForm.date, category: expenseForm.category, amount: Number(expenseForm.amount), type: expenseForm.type };
            setExpenses([newExpense, ...expenses]);
            setExpenseForm({ date: new Date().toISOString().split('T')[0], category: '', amount: '', type: 'Personal' });
            setShowQuickAdd(null);
            showToast('Gasto guardado');
          };

          const handleDeleteIncome = (id) => { setIncomes(incomes.filter(item => item.id !== id)); showToast('Eliminado', 'info'); };
          const handleDeleteExpense = (id) => { setExpenses(expenses.filter(item => item.id !== id)); showToast('Eliminado', 'info'); };

          return (
            <div className="min-h-screen bg-[#090b11] text-slate-100 flex flex-col" style={{paddingBottom: '5.5rem'}}>
              {toast && <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-sm"><div className={`flex items-center gap-2 px-4 py-3 rounded-2xl shadow-2xl backdrop-blur-md border ${toast.type === 'error' ? 'bg-rose-950/95 border-rose-800' : 'bg-emerald-950/95 border-emerald-800'}`}><span className="text-xs font-semibold">{toast.message}</span></div></div>}

              <header className="sticky top-0 z-40 bg-[#090b11]/80 backdrop-blur-xl border-b border-slate-900/60 px-4 py-6 safe-top mt-2">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <div className="p-1.5 bg-emerald-500/10 text-emerald-400 rounded-lg border border-emerald-500/20"><IconCar /></div>
                    <div><h1 className="text-sm font-bold tracking-tight bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">DriverFinanzas</h1><p className="text-[10px] text-slate-500">Móvil iPhone</p></div>
                  </div>
                  <button onClick={() => setIsConfigOpen(true)} className="p-2 bg-slate-900 border border-slate-800 rounded-xl text-slate-400 flex items-center gap-1"><IconSliders /><span className="text-[10px] font-semibold">Config</span></button>
                </div>
              </header>

              <main className="px-4 py-4 space-y-5 flex-1 max-w-md mx-auto w-full">
                {activeTab === 'dashboard' && (
                  <div className="space-y-5">
                    <div className="bg-gradient-to-b from-slate-900 to-slate-950 border border-slate-900 rounded-3xl p-5 shadow-xl">
                      <div className="flex justify-between items-start mb-3">
                        <div><span className="text-[10px] font-bold uppercase text-slate-500">Mayo Facturado</span><span className="text-3xl font-black text-white">${totalIncome.toLocaleString('es-AR')}</span></div>
                        <div className="text-right"><span className="text-[10px] font-bold uppercase text-slate-500">Meta</span><span className="text-sm font-bold text-slate-300">${monthlyGoal.toLocaleString('es-AR')}</span></div>
                      </div>
                      <div className="w-full h-2 bg-slate-950 rounded-full overflow-hidden mb-2"><div className="h-full bg-gradient-to-r from-emerald-500 to-emerald-400" style={{width: `${Math.min(100, (totalIncome / monthlyGoal) * 100)}%`}}></div></div>
                      {pendingToGoal > 0 && <div className="bg-[#0b1c15] border border-emerald-950 rounded-2xl p-4 mt-4"><span className="text-[10px] text-emerald-400 uppercase font-bold">Meta Diaria</span><span className="text-2xl font-black text-emerald-400">${Math.ceil(dailyTarget).toLocaleString('es-AR')}</span></div>}
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div className="bg-slate-900/60 border border-slate-900 rounded-2xl p-4 flex flex-col justify-between h-24">
                        <span className="text-[10px] font-bold uppercase text-slate-500">Ganancia Neta</span>
                        <div><span className={`text-lg font-bold block ${netBalance >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>${netBalance.toLocaleString('es-AR')}</span><span className="text-[9px] text-slate-500">Ingresos - Gastos</span></div>
                      </div>
                      <div className="bg-slate-900/60 border border-slate-900 rounded-2xl p-4 flex flex-col justify-between h-24">
                        <span className="text-[10px] font-bold uppercase text-slate-500">Valor/Hora</span>
                        <div><span className="text-lg font-bold text-sky-400">${Math.round(avgHourlyRate).toLocaleString('es-AR')}/h</span><span className="text-[9px] text-slate-500">{totalHours} hs</span></div>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <button onClick={() => setShowQuickAdd('income')} className="py-3 bg-emerald-500 text-[#090b11] rounded-2xl font-bold text-xs flex items-center justify-center gap-1.5"><IconPlus /> Ingreso</button>
                      <button onClick={() => setShowQuickAdd('expense')} className="py-3 bg-slate-900 border border-slate-800 text-rose-400 rounded-2xl font-bold text-xs flex items-center justify-center gap-1.5"><IconPlus /> Gasto</button>
                    </div>
                  </div>
                )}

                {activeTab === 'incomes' && (
                  <div className="space-y-4">
                    <h2 className="text-base font-bold">Ingresos</h2>
                    <div className="space-y-2.5">
                      {incomes.map(item => (
                        <div key={item.id} className="bg-slate-900/50 border border-slate-900 rounded-2xl p-4 flex items-center justify-between gap-3">
                          <div className="flex-1"><div className="flex items-center gap-1.5"><span className="font-bold text-xs">{item.app}</span><span className="text-[9px] text-slate-500">• {item.date}</span></div><p className="text-[10px] text-slate-400 line-clamp-1">{item.notes}</p></div>
                          <div className="text-right flex items-center gap-3"><div><span className="text-xs font-black text-emerald-400">${item.amount.toLocaleString('es-AR')}</span>{item.hours && <span className="text-[9px] text-slate-500 block">{item.hours}h</span>}</div><button onClick={() => handleDeleteIncome(item.id)} className="p-2.5 text-slate-600 active:text-rose-400"><IconTrash /></button></div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === 'expenses' && (
                  <div className="space-y-4">
                    <h2 className="text-base font-bold">Gastos</h2>
                    <div className="space-y-2.5">
                      {expenses.map(item => (
                        <div key={item.id} className="bg-slate-900/50 border border-slate-900 rounded-2xl p-4 flex items-center justify-between gap-3">
                          <div className="flex-1"><div className="flex items-center gap-1.5"><span className="font-bold text-xs">{item.category}</span><span className="text-[9px] text-slate-500">• {item.type}</span></div></div>
                          <div className="text-right flex items-center gap-3"><span className="text-xs font-black text-rose-400">${item.amount.toLocaleString('es-AR')}</span><button onClick={() => handleDeleteExpense(item.id)} className="p-2.5 text-slate-600 active:text-rose-400"><IconTrash /></button></div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === 'plan' && <div className="space-y-4"><h2 className="text-base font-bold">Plan</h2><div className="bg-slate-900/40 border border-slate-900 rounded-2xl p-4"><span className="text-xs font-bold">Deuda Familiar: Mes 1 de 10</span><p className="text-[10px] text-slate-400 mt-1">Cuota Mayo: $500.000 ✓</p></div></div>}
              </main>

              {isConfigOpen && (
                <div className="fixed inset-0 z-50 bg-black/80 flex items-end">
                  <div className="bg-slate-950 border-t border-slate-900 rounded-t-[32px] w-full max-w-md p-6 space-y-5 safe-bottom">
                    <div className="flex justify-between items-center"><h3 className="text-sm font-black">Ajustes</h3><button onClick={() => setIsConfigOpen(false)}><IconX /></button></div>
                    <div className="space-y-3">
                      <div><label className="text-xs text-slate-500 block mb-1">Meta Mensual</label><input type="number" value={monthlyGoal} onChange={(e) => setMonthlyGoal(Math.max(1, Number(e.target.value)))} className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 w-full text-sm font-bold" /></div>
                      <div className="grid grid-cols-2 gap-3"><div><label className="text-xs text-slate-500 block mb-1">Días</label><input type="number" value={daysRemaining} onChange={(e) => setDaysRemaining(Math.max(0, Number(e.target.value)))} className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 w-full text-sm font-bold" /></div><div><label className="text-xs text-slate-500 block mb-1">Dólar</label><input type="number" value={dollarRate} onChange={(e) => setDollarRate(Math.max(1, Number(e.target.value)))} className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 w-full text-sm font-bold" /></div></div>
                    </div>
                    <button onClick={() => { setIsConfigOpen(false); showToast('Guardado'); }} className="w-full py-3 bg-emerald-500 text-slate-950 font-black text-xs rounded-2xl">Guardar</button>
                  </div>
                </div>
              )}

              {showQuickAdd && (
                <div className="fixed inset-0 z-50 bg-black/85 flex items-end">
                  <div className="bg-slate-950 border-t border-slate-900 rounded-t-[32px] w-full max-w-md p-6 space-y-5 safe-bottom">
                    <div className="flex justify-between"><h3 className="text-sm font-black">{showQuickAdd === 'income' ? 'Ingreso' : 'Gasto'}</h3><button onClick={() => setShowQuickAdd(null)}><IconX /></button></div>
                    {showQuickAdd === 'income' ? (
                      <form onSubmit={handleAddIncome} className="space-y-3">
                        <input type="date" value={incomeForm.date} onChange={(e) => setIncomeForm({...incomeForm, date: e.target.value})} className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 w-full text-xs" />
                        <select value={incomeForm.app} onChange={(e) => setIncomeForm({...incomeForm, app: e.target.value})} className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 w-full text-xs"><option>Uber</option><option>Cabify</option><option>DiDi</option></select>
                        <input type="number" placeholder="Monto" value={incomeForm.amount} onChange={(e) => setIncomeForm({...incomeForm, amount: e.target.value})} className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 w-full text-xs text-emerald-400 font-bold" />
                        <input type="number" placeholder="Horas" value={incomeForm.hours} onChange={(e) => setIncomeForm({...incomeForm, hours: e.target.value})} className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 w-full text-xs" />
                        <button type="submit" className="w-full py-2 bg-emerald-500 text-slate-950 font-black text-xs rounded-2xl">Guardar</button>
                      </form>
                    ) : (
                      <form onSubmit={handleAddExpense} className="space-y-3">
                        <input type="date" value={expenseForm.date} onChange={(e) => setExpenseForm({...expenseForm, date: e.target.value})} className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 w-full text-xs" />
                        <select value={expenseForm.type} onChange={(e) => setExpenseForm({...expenseForm, type: e.target.value})} className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 w-full text-xs"><option>Personal</option><option>Auto</option><option>Deuda</option></select>
                        <input type="text" placeholder="Categoría" value={expenseForm.category} onChange={(e) => setExpenseForm({...expenseForm, category: e.target.value})} className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 w-full text-xs" />
                        <input type="number" placeholder="Monto" value={expenseForm.amount} onChange={(e) => setExpenseForm({...expenseForm, amount: e.target.value})} className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 w-full text-xs text-rose-400 font-bold" />
                        <button type="submit" className="w-full py-2 bg-rose-500 text-slate-950 font-black text-xs rounded-2xl">Guardar</button>
                      </form>
                    )}
                  </div>
                </div>
              )}

              <nav className="fixed bottom-0 left-0 right-0 z-40 bg-[#090b11]/90 backdrop-blur-xl border-t border-slate-950 px-4 py-2 flex justify-around items-center max-w-md mx-auto rounded-t-2xl shadow-2xl" style={{paddingBottom: 'calc(0.5rem + env(safe-area-inset-bottom))'}}>
                <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center gap-0.5 text-xs font-bold ${activeTab === 'dashboard' ? 'text-emerald-400' : 'text-slate-500'}`}><IconTrendingUp /> Dashboard</button>
                <button onClick={() => setActiveTab('incomes')} className={`flex flex-col items-center gap-0.5 text-xs font-bold ${activeTab === 'incomes' ? 'text-emerald-400' : 'text-slate-500'}`}><IconDollar /> Ingresos</button>
                <button onClick={() => setActiveTab('expenses')} className={`flex flex-col items-center gap-0.5 text-xs font-bold ${activeTab === 'expenses' ? 'text-emerald-400' : 'text-slate-500'}`}><IconTrendingDown /> Gastos</button>
                <button onClick={() => setActiveTab('plan')} className={`flex flex-col items-center gap-0.5 text-xs font-bold ${activeTab === 'plan' ? 'text-emerald-400' : 'text-slate-500'}`}><IconBriefcase /> Plan</button>
              </nav>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
